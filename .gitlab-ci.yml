workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'
    - when: never

stages:
  - check
  - update
  - release

default:
  image: rust:1.98-bookworm
  tags:
    - docker
  before_script:
    - apt-get update -qq
    - apt-get install -y --no-install-recommends gh python3
    - scripts/ci/setup.sh
  after_script:
    - scripts/ci/github_status.sh "$CI_JOB_STATUS"
  cache:
    when: always
    key:
      files:
        - Cargo.lock
      prefix: voice-chat-v2
    paths:
      - .horizon/
      - target/

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.horizon/cargo"
  CARGO_TARGET_DIR: "$CI_PROJECT_DIR/target"
  CARGO_TERM_COLOR: never
  GH_CONFIG_DIR: "$CI_PROJECT_DIR/.gh"
  GIT_CONFIG_GLOBAL: "/tmp/voice-chat-gitconfig"
  HORIZON_GITHUB_TOKEN: "$GH_TOKEN"

verify:
  stage: check
  resource_group: voice-chat
  timeout: 45m
  script:
    - scripts/ci/github_status.sh pending
    - scripts/ci/verify.sh
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - target/horizon-mod/voice_chat.hmod

sdk_update:
  stage: update
  variables:
    SDK_REQUEST: nightly
  resource_group: voice-chat
  timeout: 45m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - scripts/ci/github_status.sh pending
    - scripts/ci/update_sdk.sh
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - target/horizon-mod/voice_chat.hmod

release:
  stage: release
  resource_group: voice-chat
  timeout: 45m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
      when: manual
  script:
    - scripts/ci/github_status.sh pending
    - scripts/ci/release.sh
