[package]
name = "voice_chat"
version = "1.0.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
ring = "0.17"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.16"

[target.'cfg(target_arch = "wasm32")'.dependencies]
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }

[features]
default = ["std", "heap"]
std = []
heap = ["std"]
libm = []
portable-atomic = []
avx = []
sse = []
fma = []
