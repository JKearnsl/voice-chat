id = "voice_chat"
name = "Voice Chat"
version = "1.0.0"
description = "Unofficial Simple Voice Chat client for Horizon — Minecraft proximity voice chat with positional audio, groups, push-to-talk, voice activation, and per-player volume controls. Native Rust mod."
authors = ["JKearnsl"]
license = "MIT"
api = "0.2"
side = "client"
capabilities = ["registries"]
homepage = "https://github.com/JKearnsl/voice-chat"
issues = "https://github.com/JKearnsl/voice-chat/issues"

[native]
game = "26.3"
horizon = "dd67b76ff23e28c6d8e21859df600d31572f81a0"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"

[[native.module]]
id = "audio"
file = "crates/horizon-client/src/game/network/remote/mod.rs"
name = "voicechat_audio"
source = "src/mixins/audio.rs"

[[native.module]]
id = "key_labels"
file = "crates/horizon-client/src/game/modding/mods/mod.rs"
name = "voicechat_key_labels"
source = "src/mixins/key_labels.rs"

[[native.mixin]]
id = "tick"
target = "horizon_client::game::remote::Game<'_>::tick_remote"
kind = "HEAD"
helper = "src/mixins/tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "language"
target = "horizon_client::game::options::Game<'_>::load_language"
kind = "HEAD"
helper = "src/mixins/language.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "code", ty = "&str", value = "code" },
]

[[native.mixin]]
id = "options"
target = "horizon_client::game::options::Game<'_>::open_options_at"
kind = "HEAD"
helper = "src/mixins/options.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
]

[[native.mixin]]
id = "hud"
target = "horizon_client::game::extras::Game<'_>::draw_extras"
kind = "AFTER_CALL"
selector = "self.native_render_gui_post"
require = 1
ordinal = 0
result = "()"
helper = "src/mixins/hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "$local_mut:corners:0" },
]

[[native.mixin]]
id = "name_tag"
target = "horizon_client::game::names::Game<'_>::styled_name_tag_quads"
kind = "HEAD"
helper = "src/mixins/name_tag.rs"
bindings = [
  { name = "game", ty = "&crate::game::Game<'_>", value = "&*self" },
  { name = "o", ty = "glam::DVec3", value = "o" },
  { name = "lines", ty = "&[(horizon_client::text::Text, f64)]", value = "lines" },
  { name = "text_alpha", ty = "u32", value = "text_alpha" },
  { name = "background", ty = "bool", value = "background" },
  { name = "text_layer", ty = "u32", value = "text_layer" },
  { name = "light", ty = "u32", value = "light" },
  { name = "unit", ty = "f32", value = "unit" },
  { name = "out", ty = "&mut Vec<horizon_client::mesher::Vertex>", value = "&mut *out" },
]
