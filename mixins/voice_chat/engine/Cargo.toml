[package]
name = "voicechat-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An unofficial Simple Voice Chat protocol client for Horizon: protocol, pure-Rust Opus, and audio"
publish = false

# Horizon builds mods offline from its own Cargo.lock and forbids `path`
# dependencies, so every dep must be a crate already in that lock (cpal, ring).
# Opus has no crate in the lock, so the pure-Rust `opus-rs` is inlined as the
# in-crate module `src/opus_rs/` (not a dependency) — no C libopus, no
# libloading, no bundled binaries.
[dependencies]
ring = "0.17"
cpal = "0.16"

# Features the inlined Opus module reads (its own `#[cfg(feature = ...)]`). We
# build it with std + heap (small structs on the heap, std maths and atomics);
# the no_std / libm / SIMD-gate features stay off.
[features]
default = ["std", "heap"]
std = []
heap = ["std"]
libm = []
portable-atomic = []
avx = []
sse = []
fma = []

[lib]
name = "voicechat_engine"
path = "src/lib.rs"
